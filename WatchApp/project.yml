name: GoldAU9999
options:
  bundleIdPrefix: app.goldau9999
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""             # 部署时由 Xcode 自动选择登录的开发者 Team
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_VERSION: "5.0"

targets:
  # ---------- iOS App（部署载体：连数据线装到 iPhone）----------
  GoldPhone:
    type: application
    platform: iOS
    sources:
      - Sources/Phone
      - Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.goldau9999.GoldAU9999
        INFOPLIST_FILE: Config/Phone-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: GoldAU9999
        embed: true   # 手表 App 随 iOS App 一起，装到 iPhone 后自动同步到手表

  # ---------- watchOS App（配套手表 App）----------
  GoldAU9999:
    type: application
    platform: watchOS
    sources:
      - Sources/App
      - Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.goldau9999.GoldAU9999.watchkitapp
        INFOPLIST_FILE: Config/App-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: GoldComplicationExtension
        embed: true

  # ---------- 表盘复杂功能（WidgetKit 扩展）----------
  GoldComplicationExtension:
    type: app-extension
    platform: watchOS
    sources:
      - Sources/Widget
      - Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.goldau9999.GoldAU9999.watchkitapp.Complication
        INFOPLIST_FILE: Config/Widget-Info.plist

schemes:
  GoldPhone:
    build:
      targets:
        GoldPhone: all
    run:
      config: Debug
